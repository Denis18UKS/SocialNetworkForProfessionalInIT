plugins {
    id 'com.android.application'
}

def socialbirdVersionCode = (System.getenv('SOCIALBIRD_VERSION_CODE') ?: '1').toInteger()
def socialbirdVersionName = System.getenv('SOCIALBIRD_VERSION_NAME') ?: '1.0.0'

android {
    namespace 'io.itbird.socialbird'
    compileSdk 35

    defaultConfig {
        applicationId 'io.itbird.socialbird'
        minSdk 26
        targetSdk 35
        versionCode socialbirdVersionCode
        versionName socialbirdVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Native background signalling/notifications. The website remains the single UI
    // codebase; Android only owns OS-level capabilities that a WebView cannot provide.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
