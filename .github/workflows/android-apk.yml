name: Build SocialBIRD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/socialbird-vps-production
    paths:
      - "android-app/**"
      - "deploy/apply-android-runtime-fixes.mjs"
      - "deploy/apply-native-fcm-android.mjs"
      - "deploy/apply-android-update-awareness.mjs"
      - "deploy/apply-cparty-android-deeplink.mjs"
      - "deploy/apply-android-forced-updater.mjs"
      - "deploy/apply-android-call-system-v4.mjs"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: socialbird-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply native Android runtime, FCM, update, C-Party and Call V4 integration
        run: |
          node --check deploy/apply-android-runtime-fixes.mjs
          node --check deploy/apply-native-fcm-android.mjs
          node --check deploy/apply-android-update-awareness.mjs
          node --check deploy/apply-cparty-android-deeplink.mjs
          node --check deploy/apply-android-forced-updater.mjs
          node --check deploy/apply-android-call-system-v4.mjs
          node deploy/apply-android-runtime-fixes.mjs
          node deploy/apply-native-fcm-android.mjs
          node deploy/apply-android-update-awareness.mjs
          node deploy/apply-cparty-android-deeplink.mjs
          node deploy/apply-android-forced-updater.mjs
          node deploy/apply-android-call-system-v4.mjs
          grep -q "NATIVE_ANDROID_RUNTIME: initialize-runtime" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "NATIVE_ANDROID_RUNTIME: answer-intent" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "itbird-native-answer-call" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "NATIVE_ANDROID_RUNTIME: web-fullscreen" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "ANDROID_CALL_SYSTEM_V4: speaker-js-bridge" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "NATIVE_FCM_PUSH" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "ANDROID_UPDATE_AWARENESS: expose-version-code" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "CPARTY_ANDROID_DEEPLINK_V1: canonical-socialbird-origin" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "NATIVE_FORCED_UPDATE_V1: launch-gate" android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "NATIVE_FORCED_UPDATE_V1: stable-release-manifest" android-app/app/src/main/java/io/itbird/socialbird/NativeUpdateManager.java
          grep -q 'SITE_ORIGIN = "https://socialbird.ru"' android-app/app/src/main/java/io/itbird/socialbird/MainActivity.java
          grep -q "SocialBirdFirebaseMessagingService" android-app/app/src/main/AndroidManifest.xml
          grep -q "CallControlActivity" android-app/app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="socialbird-call"' android-app/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android-app/app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" android-app/app/src/main/AndroidManifest.xml
          grep -q "android.permission.MODIFY_AUDIO_SETTINGS" android-app/app/src/main/AndroidManifest.xml
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" android-app/app/src/main/AndroidManifest.xml
          grep -q "firebase-messaging" android-app/app/build.gradle

      - name: Require Firebase Android configuration
        env:
          FIREBASE_PROJECT_ID: ${{ vars.SOCIALBIRD_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.SOCIALBIRD_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.SOCIALBIRD_FIREBASE_API_KEY }}
          FIREBASE_SENDER_ID: ${{ vars.SOCIALBIRD_FIREBASE_SENDER_ID }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo "Missing repository variable SOCIALBIRD_FIREBASE_PROJECT_ID"; exit 2; }
          test -n "$FIREBASE_APP_ID" || { echo "Missing repository variable SOCIALBIRD_FIREBASE_APP_ID"; exit 2; }
          test -n "$FIREBASE_API_KEY" || { echo "Missing repository variable SOCIALBIRD_FIREBASE_API_KEY"; exit 2; }
          test -n "$FIREBASE_SENDER_ID" || { echo "Missing repository variable SOCIALBIRD_FIREBASE_SENDER_ID"; exit 2; }
          echo "Firebase Android push configuration is present."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable sideload signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: socialbird-android-sideload-key-v1

      - name: Require the existing stable sideload signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Stable SocialBIRD Android signing key is missing. Refusing to rotate it automatically because a new key would make in-place updates fail." >&2
            exit 3
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null
          echo "Stable sideload signing key is present."

      - name: Build installable APK
        env:
          SOCIALBIRD_VERSION_CODE: ${{ github.run_number }}
          SOCIALBIRD_VERSION_NAME: 1.2.${{ github.run_number }}
          SOCIALBIRD_FIREBASE_PROJECT_ID: ${{ vars.SOCIALBIRD_FIREBASE_PROJECT_ID }}
          SOCIALBIRD_FIREBASE_APP_ID: ${{ vars.SOCIALBIRD_FIREBASE_APP_ID }}
          SOCIALBIRD_FIREBASE_API_KEY: ${{ vars.SOCIALBIRD_FIREBASE_API_KEY }}
          SOCIALBIRD_FIREBASE_SENDER_ID: ${{ vars.SOCIALBIRD_FIREBASE_SENDER_ID }}
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: Prepare stable APK and forced-update metadata
        shell: bash
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk SocialBIRD-Android.apk
          test -s SocialBIRD-Android.apk
          APK_SHA256="$(sha256sum SocialBIRD-Android.apk | awk '{print $1}')"
          SOCIALBIRD_APK_SHA256="$APK_SHA256" node <<'NODE'
          const fs = require('fs');
          const versionCode = Number(process.env.GITHUB_RUN_NUMBER);
          const versionName = `1.2.${versionCode}`;
          const metadata = {
            versionCode,
            versionName,
            minSupportedVersionCode: versionCode,
            forceUpdate: true,
            apkUrl: 'https://github.com/Denis18UKS/SocialNetworkForProfessionalInIT/releases/download/android-latest/SocialBIRD-Android.apk',
            sha256: process.env.SOCIALBIRD_APK_SHA256,
            publishedAt: new Date().toISOString(),
            channel: 'android-latest'
          };
          fs.writeFileSync('SocialBIRD-Android-version.json', JSON.stringify(metadata, null, 2) + '\n');
          NODE
          test -s SocialBIRD-Android-version.json
          grep -q '"forceUpdate": true' SocialBIRD-Android-version.json
          grep -q '"minSupportedVersionCode"' SocialBIRD-Android-version.json
          grep -q '"sha256"' SocialBIRD-Android-version.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialBIRD-Android
          path: |
            SocialBIRD-Android.apk
            SocialBIRD-Android-version.json
          if-no-files-found: error

      - name: Publish stable android-latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="SocialBIRD Android Call System V4: единый React/WebRTC call manager, FCM push-answer, управление микрофоном/звуком/камерой, фронтальная/задняя камера, speaker/earpiece, PiP и MediaProjection screen share через socialbird.ru; принудительное self-update APK с SHA-256 проверкой."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest SocialBIRD-Android.apk --clobber
            gh release upload android-latest SocialBIRD-Android-version.json --clobber
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest SocialBIRD-Android.apk SocialBIRD-Android-version.json \
              --title "SocialBIRD Android" \
              --notes "$NOTES" \
              --prerelease
          fi