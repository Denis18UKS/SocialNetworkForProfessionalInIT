name: Build SocialBIRD Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/socialbird-vps-production
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: socialbird-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable sideload signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: socialbird-android-sideload-key-v1

      - name: Ensure sideload signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=SocialBIRD Android Sideload,O=IT-BIRD,C=RU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build installable APK
        run: gradle -p android-app assembleDebug --no-daemon --stacktrace

      - name: Prepare stable APK name
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk SocialBIRD-Android.apk
          test -s SocialBIRD-Android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialBIRD-Android
          path: SocialBIRD-Android.apk
          if-no-files-found: error

      - name: Publish stable android-latest download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest SocialBIRD-Android.apk --clobber
          else
            gh release create android-latest SocialBIRD-Android.apk \
              --title "SocialBIRD Android" \
              --notes "Автоматическая APK-сборка Android-оболочки SocialBIRD. Для установки разрешите Android установку APK из браузера или файлового менеджера." \
              --prerelease
          fi
