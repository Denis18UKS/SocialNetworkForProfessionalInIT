name: Production hardening and build

on:
  push:
    branches:
      - deploy/socialbird-vps-production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socialbird-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Apply current production wiring
        run: |
          # Call System V4 is the base owner; V5 extends that single manager with
          # reliable push-answer, real connected-state, camera resync and per-user volume.
          # Retired parallel call patchers must stay disabled.
          node deploy/apply-mail-recovery-fixes.mjs
          node deploy/apply-chat-media-mobile-fix.mjs
          node deploy/apply-chat-media-backend-fix.mjs
          node deploy/apply-native-android-integration.mjs
          node deploy/apply-native-fcm-push.mjs
          node deploy/apply-call-system-v4.mjs
          node deploy/apply-call-system-v5.mjs
          node deploy/apply-call-system-v5-push-state-fix.mjs
          node deploy/apply-seo-fixes.mjs
          node deploy/harden-source.mjs --in-place
          node deploy/enable-sandbox-compiler.mjs --in-place
          node deploy/patch-installer.mjs

      - name: Check generated source and V5 invariants
        run: |
          node --check deploy/apply-call-system-v4.mjs
          node --check deploy/apply-call-system-v5.mjs
          node --check deploy/apply-call-system-v5-push-state-fix.mjs
          node --check deploy/apply-mail-recovery-fixes.mjs
          node --check deploy/apply-chat-media-mobile-fix.mjs
          node --check deploy/apply-chat-media-backend-fix.mjs
          node --check deploy/apply-native-android-integration.mjs
          node --check deploy/apply-native-fcm-push.mjs
          node --check deploy/apply-native-fcm-android.mjs
          node --check deploy/apply-android-runtime-fixes.mjs
          node --check deploy/apply-seo-fixes.mjs
          node --check scripts/generate-seo.mjs
          node --check deploy/ensure-vapid.mjs
          node --check deploy/generate-owner-recovery-codes.mjs
          node --check backend/server.js
          node --check backend/native-fcm-push.js
          node --check backend/password-recovery.js
          node --check backend/social-next-features.js
          node --check backend/offline-call-queue.js
          node --check backend/web-push-native.js
          node --check backend/compiler-client.js
          node --check deploy/compiler-runner/server.mjs
          node --check deploy/compiler-sandbox/runner.mjs
          node --check deploy/compiler-sandbox/smoke-test.mjs
          node --check deploy/enable-sandbox-compiler.mjs
          node --check deploy/patch-installer.mjs
          bash -n deploy/install.sh
          bash -n deploy/update-mail-recovery.sh
          bash -n deploy/update-android-app.sh
          bash -n deploy/update-native-android-complete.sh
          bash -n deploy/update-native-parity-seo.sh
          bash -n deploy/update-chat-media-native-push.sh
          bash -n deploy/configure-fcm-server.sh
          bash -n deploy/configure-mail.sh
          grep -q 'export const CallProvider' src/components/call/CallProvider.tsx
          grep -q 'clientRole: "call-host"' src/components/call/CallProvider.tsx
          grep -q 'CALL_SCREEN_START' src/components/call/CallProvider.tsx
          grep -q 'CALL_CAMERA_RESYNC' src/components/call/CallProvider.tsx
          grep -q 'setParticipantVolume' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: defer-answer-until-ready' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: real-webrtc-connected-state' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: cold-start-user-id-defer' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: native-state-follows-real-phase' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: camera-renegotiation' src/components/call/CallProvider.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: participant-volume-slider' src/components/GlobalCallOverlay.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V5: resilient-remote-video' src/components/GlobalCallOverlay.tsx
          grep -q 'Перевернуть камеру' src/components/GlobalCallOverlay.tsx
          grep -q 'Говорит' src/components/GlobalCallOverlay.tsx
          grep -q 'SOCIALBIRD_CALL_SYSTEM_V4: CallProvider owns CALL_\* signalling' src/components/RealtimeNotifications.tsx
          grep -q '<CallProvider>' src/App.tsx
          node deploy/harden-source.mjs
          node deploy/enable-sandbox-compiler.mjs
          node --check backend/server.production.js

      - name: Install frontend dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend and SEO route HTML
        run: npm run build
        env:
          VITE_API_URL: https://api.socialbird.ru
          VITE_STUN_URLS: stun:stun.l.google.com:19302
          VITE_TURN_URLS: turn:api.socialbird.ru:3478?transport=udp,turn:api.socialbird.ru:3478?transport=tcp,turns:api.socialbird.ru:5349?transport=tcp
          VITE_TURN_USERNAME: socialbird
          VITE_TURN_CREDENTIAL: ci-placeholder-only

      - name: Verify production artifacts
        run: |
          test -s dist/robots.txt
          test -s dist/sitemap.xml
          test -s dist/android-app/index.html
          test -s dist/compiler/index.html
          test -s dist/xakatons/index.html
          test -s dist/forum/index.html
          grep -q 'rel="canonical"' dist/index.html
          grep -q 'SocialBIRD — социальная сеть для IT-специалистов' dist/index.html
          grep -q 'sitemap.xml' dist/robots.txt
          grep -q 'MAX_TRANSPORT_FILENAME_CHARS = 48' src/pages/Chats.tsx
          grep -q 'MAX_TRANSPORT_FILENAME_CHARS = 48' src/pages/GroupChats.tsx
          grep -q 'CHAT_MEDIA_BACKEND_FIX' backend/server.js
          grep -q 'NATIVE_FCM_PUSH' backend/server.js

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build isolated compiler image
        run: docker build --pull --tag socialbird/compiler-sandbox:latest deploy/compiler-sandbox

      - name: Smoke-test all compiler languages
        run: node deploy/compiler-sandbox/smoke-test.mjs

      - name: Validate repository changes
        run: git diff --check

      - name: Commit generated hardened source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js \
            backend/native-fcm-push.js \
            backend/social-next-features.js \
            backend/offline-call-queue.js \
            deploy/install.sh \
            deploy/nginx-socialbird.conf.template \
            index.html \
            src/App.tsx \
            src/main.tsx \
            src/index.css \
            src/lib/settings.ts \
            src/lib/i18n.ts \
            src/lib/webrtc.ts \
            src/lib/reconnecting-websocket.ts \
            src/lib/call-audio-reliability.ts \
            src/lib/call-media-bus.ts \
            src/lib/screen-share.ts \
            src/components/AppSidebar.tsx \
            src/components/CallTrackVideo.tsx \
            src/components/FriendQrTools.tsx \
            src/components/PushCallRegistration.tsx \
            src/components/NativeAppBridge.tsx \
            src/components/SeoManager.tsx \
            src/components/RealtimeNotifications.tsx \
            src/components/VoiceCallControls.tsx \
            src/components/GlobalCallOverlay.tsx \
            src/components/call/CallProvider.tsx \
            src/components/call/NativeCallAudioBridge.tsx \
            src/components/call/PushCallDeepLinkBridge.tsx \
            src/components/VoiceMessageBubble.tsx \
            src/components/PasswordRecovery.tsx \
            src/pages/AndroidApp.tsx \
            src/pages/Index.tsx \
            src/pages/FriendRequests.tsx \
            src/pages/FriendQrLanding.tsx \
            src/pages/MyProfile.tsx \
            src/pages/Settings.tsx \
            src/pages/Login.tsx \
            src/pages/Users.tsx \
            src/pages/Chats.tsx \
            src/pages/GroupChats.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply generated production V5 call and platform fixes"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi