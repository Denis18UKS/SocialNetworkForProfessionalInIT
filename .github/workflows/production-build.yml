name: Production hardening and build

on:
  push:
    branches:
      - deploy/socialbird-vps-production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socialbird-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Apply application, mobile, call, mail, social, screen-share, delivery, UI, production and compiler fixes
        run: |
          node deploy/apply-app-fixes.mjs
          node deploy/apply-mobile-layout-fixes.mjs
          node deploy/apply-mobile-call-audio-fixes.mjs
          node deploy/apply-call-reliability-fixes.mjs
          node deploy/apply-call-mobile-upload-fixes.mjs
          node deploy/apply-call-video-mount-fix.mjs
          node deploy/apply-mail-recovery-fixes.mjs
          node deploy/apply-social-next-v2.mjs
          node deploy/apply-screen-share-audio-fixes.mjs
          node deploy/apply-mobile-call-delivery-fix.mjs
          node deploy/apply-call-hangup-lifecycle-fix.mjs
          node deploy/apply-mobile-ui-media-fixes.mjs
          node deploy/harden-source.mjs --in-place
          node deploy/enable-sandbox-compiler.mjs --in-place
          node deploy/patch-installer.mjs

      - name: Check generated backend, runner and installer syntax
        run: |
          node --check deploy/apply-app-fixes.mjs
          node --check deploy/apply-mobile-layout-fixes.mjs
          node --check deploy/apply-mobile-call-audio-fixes.mjs
          node --check deploy/apply-call-reliability-fixes.mjs
          node --check deploy/apply-call-mobile-upload-fixes.mjs
          node --check deploy/apply-call-video-mount-fix.mjs
          node --check deploy/apply-mail-recovery-fixes.mjs
          node --check deploy/apply-social-next-fixes.mjs
          node --check deploy/apply-social-next-v2.mjs
          node --check deploy/apply-screen-share-audio-fixes.mjs
          node --check deploy/apply-mobile-call-delivery-fix.mjs
          node --check deploy/apply-call-hangup-lifecycle-fix.mjs
          node --check deploy/apply-mobile-ui-media-fixes.mjs
          node --check deploy/ensure-vapid.mjs
          node --check deploy/generate-owner-recovery-codes.mjs
          node --check backend/server.js
          node --check backend/password-recovery.js
          node --check backend/social-next-features.js
          node --check backend/offline-call-queue.js
          node --check backend/web-push-native.js
          node --check backend/compiler-client.js
          node --check deploy/compiler-runner/server.mjs
          node --check deploy/compiler-sandbox/runner.mjs
          node --check deploy/compiler-sandbox/smoke-test.mjs
          node --check deploy/enable-sandbox-compiler.mjs
          node --check deploy/patch-installer.mjs
          bash -n deploy/install.sh
          bash -n deploy/update-live-call-mobile-upload.sh
          bash -n deploy/update-mail-recovery.sh
          bash -n deploy/update-social-next.sh
          bash -n deploy/update-screen-share.sh
          bash -n deploy/update-mobile-call-delivery.sh
          bash -n deploy/update-call-hangup-lifecycle.sh
          bash -n deploy/update-mobile-ui-media.sh
          bash -n deploy/configure-mail.sh
          node deploy/apply-call-mobile-upload-fixes.mjs
          node deploy/apply-call-video-mount-fix.mjs
          node deploy/apply-mail-recovery-fixes.mjs
          node deploy/apply-social-next-v2.mjs
          node deploy/apply-screen-share-audio-fixes.mjs
          node deploy/apply-mobile-call-delivery-fix.mjs
          node deploy/apply-call-hangup-lifecycle-fix.mjs
          node deploy/apply-mobile-ui-media-fixes.mjs
          node deploy/harden-source.mjs
          node deploy/enable-sandbox-compiler.mjs
          node --check backend/server.production.js

      - name: Install frontend dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.31.207.74.138.nip.io
          VITE_STUN_URLS: stun:stun.l.google.com:19302
          VITE_TURN_URLS: turn:api.31.207.74.138.nip.io:3478?transport=udp,turn:api.31.207.74.138.nip.io:3478?transport=tcp,turns:api.31.207.74.138.nip.io:5349?transport=tcp
          VITE_TURN_USERNAME: socialbird
          VITE_TURN_CREDENTIAL: ci-placeholder-only

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build isolated compiler image
        run: docker build --pull --tag socialbird/compiler-sandbox:latest deploy/compiler-sandbox

      - name: Smoke-test all compiler languages
        run: node deploy/compiler-sandbox/smoke-test.mjs

      - name: Validate repository changes
        run: git diff --check

      - name: Commit generated hardened source
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js \
            backend/social-next-features.js \
            backend/offline-call-queue.js \
            deploy/install.sh \
            deploy/nginx-socialbird.conf.template \
            index.html \
            src/App.tsx \
            src/main.tsx \
            src/index.css \
            src/lib/settings.ts \
            src/lib/i18n.ts \
            src/lib/webrtc.ts \
            src/lib/reconnecting-websocket.ts \
            src/lib/call-audio-reliability.ts \
            src/lib/call-media-bus.ts \
            src/lib/screen-share.ts \
            src/components/AppSidebar.tsx \
            src/components/CallTrackVideo.tsx \
            src/components/FriendQrTools.tsx \
            src/components/PushCallRegistration.tsx \
            src/components/RealtimeNotifications.tsx \
            src/components/VoiceCallControls.tsx \
            src/components/VoiceMessageBubble.tsx \
            src/components/PasswordRecovery.tsx \
            src/pages/FriendRequests.tsx \
            src/pages/FriendQrLanding.tsx \
            src/pages/MyProfile.tsx \
            src/pages/Settings.tsx \
            src/pages/Login.tsx \
            src/pages/Users.tsx \
            src/pages/Chats.tsx \
            src/pages/GroupChats.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Apply generated production social, screen-share and mobile-call fixes"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
