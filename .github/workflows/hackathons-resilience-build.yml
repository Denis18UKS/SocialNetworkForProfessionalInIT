name: Hackathons resilience build

on:
  push:
    branches:
      - deploy/socialbird-vps-production
    paths:
      - 'tests/hackathons-resilience.test.mjs'
      - 'backend/server.js'
      - 'deploy/apply-hackathons-resilience-v2.mjs'
      - 'deploy/update-hackathons-resilience-v2.sh'
      - 'deploy/update-socialbird-media-playlist-unrestricted.sh'
      - 'deploy/update-registration-admin-android.sh'
      - '.github/workflows/hackathons-resilience-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply hackathons fix idempotently
        run: |
          node deploy/apply-hackathons-resilience-v2.mjs
          node deploy/apply-hackathons-resilience-v2.mjs

      - name: Regression tests
        run: node --test tests/hackathons-resilience.test.mjs

      - name: Syntax and updater checks
        run: |
          node --check backend/server.js
          node --check deploy/apply-hackathons-resilience-v2.mjs
          bash -n deploy/update-hackathons-resilience-v2.sh
          git diff --check

      - name: Materialize verified source on production branch
        run: |
          if git diff --quiet -- backend/server.js; then
            echo "backend/server.js already contains the verified hackathons fix"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git commit -m "Apply hackathons resilience v2 to production source"
          git push origin HEAD:deploy/socialbird-vps-production
