name: Build SocialBIRD Admin Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - deploy/socialbird-vps-production
    paths:
      - "admin-desktop/**"
      - ".github/workflows/admin-desktop.yml"

permissions:
  contents: write

concurrency:
  group: socialbird-admin-desktop
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin-desktop
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check renderer/app.js
          node --check renderer/launcher.js
          node --check renderer/cinema.js

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify installer
        shell: pwsh
        run: |
          $file = "dist/SocialBIRD-Admin-Setup.exe"
          if (-not (Test-Path $file)) { throw "Admin installer was not generated" }
          if ((Get-Item $file).Length -lt 1000000) { throw "Admin installer is unexpectedly small" }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialBIRD-Admin-Windows
          path: admin-desktop/dist/SocialBIRD-Admin-Setup.exe
          if-no-files-found: error

      - name: Publish stable admin-desktop-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          NOTES="SocialBIRD Admin Desktop 1.1: email 2FA, управление пользователями, модерация, аудит и C-Party Library Manager для добавления фильмов, сериалов и серий с resumable-загрузкой видео без перекодирования."
          if gh release view admin-desktop-latest >/dev/null 2>&1; then
            gh release upload admin-desktop-latest admin-desktop/dist/SocialBIRD-Admin-Setup.exe --clobber
            gh release edit admin-desktop-latest --notes "$NOTES"
          else
            gh release create admin-desktop-latest admin-desktop/dist/SocialBIRD-Admin-Setup.exe \
              --title "SocialBIRD Admin Desktop" \
              --notes "$NOTES" \
              --prerelease
          fi
